# ==============================================================================
# Coverage-transition regulatory data: values that do not depend on plan year.
#
# Every value is a "sourced value":
#   value:          the number / object the rules engine uses
#   effectiveDate:  date the value took effect (quoted ISO date)
#   sourceUrl:      where to verify it
#   verified:       true only after a human has checked it against sourceUrl
#   todo:           present when the value is uncertain or a placeholder
#
# Shared source metadata is declared once as YAML anchors (_sources) and merged
# into each value with "<<: *anchor". The engine never reads _sources directly.
#
# Bump dataVersion whenever any value changes.
# ==============================================================================
dataVersion: "2026-10-10.1"

_sources:
  hhs2025: &hhs2025
    effectiveDate: "2025-01-15"
    sourceUrl: https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines
    verified: false
  hhs2026: &hhs2026
    effectiveDate: "2026-01-15"
    sourceUrl: https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines
    verified: false
    todo: "PLACEHOLDER copied from the 2025 guidelines. Replace with the published 2026 HHS poverty guidelines (used for Medicaid/CHIP in 2026 and for plan-year-2027 subsidies)."
  dolCobra: &dolCobra
    effectiveDate: "1986-04-07"
    sourceUrl: https://www.dol.gov/agencies/ebsa/laws-and-regulations/laws/cobra
    verified: false
  dolCobraNotice: &dolCobraNotice
    effectiveDate: "2004-05-26"
    sourceUrl: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XXV/subchapter-L/part-2590/subpart-A/section-2590.606-4
    verified: false
  cmsSep: &cmsSep
    effectiveDate: "2022-01-01"
    sourceUrl: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-B/part-155/subpart-E/section-155.420
    verified: false
  hipaaSpecial: &hipaaSpecial
    effectiveDate: "2004-12-30"
    sourceUrl: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XXV/subchapter-L/part-2590/subpart-B/section-2590.701-6
    verified: false
  medicarePartB: &medicarePartB
    effectiveDate: "2026-01-01"
    sourceUrl: https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start
    verified: false
  medicaidExpansion: &medicaidExpansion
    effectiveDate: "2026-01-01"
    sourceUrl: https://www.kff.org/medicaid/issue-brief/status-of-state-medicaid-expansion-decisions-interactive-map/
    verified: false
  chipLimits: &chipLimits
    effectiveDate: "2026-01-01"
    sourceUrl: https://www.kff.org/affordable-care-act/state-indicator/medicaid-and-chip-income-eligibility-limits-for-children-as-a-percent-of-the-federal-poverty-level/
    verified: false
    todo: "Per-state CHIP upper income limit not loaded yet. Engine falls back to chipFallback ranges. Fill limitPctFpl per state from the source."
  exchangeList: &exchangeList
    effectiveDate: "2026-01-01"
    sourceUrl: https://www.cms.gov/cciio/resources/fact-sheets-and-faqs/state-health-insurance-marketplace-types
    verified: false
  medicaidHelp: &medicaidHelp
    effectiveDate: "2026-01-01"
    sourceUrl: https://www.medicaid.gov/about-us/where-can-people-get-help-medicaid-chip/index.html
    verified: false
    todo: "Generic Medicaid link. Replace with each state's Medicaid application URL."
  kffEhbs: &kffEhbs
    effectiveDate: "2025-10-22"
    sourceUrl: https://www.kff.org/health-costs/report/2025-employer-health-benefits-survey/
    verified: false
  heuristic: &heuristic
    effectiveDate: "2026-10-10"
    sourceUrl: https://meps.ahrq.gov/mepsweb/data_stats/quick_tables.jsp
    verified: false
    todo: "Modeling assumption, not a regulation. Review the numbers and adjust."

# ------------------------------------------------------------------------------
# Federal poverty guidelines, keyed by guideline year.
# Marketplace subsidies for plan year N use guideline year N-1.
# Medicaid/CHIP use the guideline year that is current on the application date.
# ------------------------------------------------------------------------------
fplGuidelines:
  "2025":
    contiguous: { <<: *hhs2025, value: { firstPerson: 15650, eachAdditional: 5500 } }
    AK:         { <<: *hhs2025, value: { firstPerson: 19550, eachAdditional: 6880 } }
    HI:         { <<: *hhs2025, value: { firstPerson: 17990, eachAdditional: 6330 } }
  "2026":
    contiguous: { <<: *hhs2026, value: { firstPerson: 15650, eachAdditional: 5500 } }
    AK:         { <<: *hhs2026, value: { firstPerson: 19550, eachAdditional: 6880 } }
    HI:         { <<: *hhs2026, value: { firstPerson: 17990, eachAdditional: 6330 } }

# ------------------------------------------------------------------------------
# Federal timing and threshold rules (not plan-year specific)
# ------------------------------------------------------------------------------
rules:
  cobraElectionDays:            { <<: *dolCobra, value: 60 }
  cobraFirstPaymentDays:        { <<: *dolCobra, value: 45 }
  cobraMaxMonthsJobLoss:        { <<: *dolCobra, value: 18 }
  cobraPremiumMaxPercent:       { <<: *dolCobra, value: 102 }
  # Employer has 30 days to notify the plan administrator, who then has 14 days
  # to notify the employee (44 days when the employer is also the administrator).
  cobraNoticeMaxDays:           { <<: *dolCobraNotice, value: 44 }
  marketplaceSepDaysBefore:     { <<: *cmsSep, value: 60 }
  marketplaceSepDaysAfter:
    <<: *cmsSep
    value: 60
    todo: "Counted from the last day of coverage. If CMS counts from the day after, the real window is one day longer; this value is the conservative reading."
  employerPlanSpecialEnrollmentDays:
    <<: *hipaaSpecial
    value: 30
    todo: "30 days is the legal minimum; some employer plans allow longer. Counted from the last day of coverage (conservative)."
  medicarePartBSepMonths:       { <<: *medicarePartB, value: 8 }
  medicareAge:                  { <<: *medicarePartB, value: 65 }
  medicaidExpansionLimitPctFpl: { <<: *medicaidExpansion, value: 138 }
  marketplaceSubsidyFloorPctFpl:
    <<: *cmsSep
    sourceUrl: https://www.healthcare.gov/lower-costs/
    value: 100
  childMaxAge:
    <<: *chipLimits
    todo: null
    value: 18
  chipFallback:
    <<: *chipLimits
    todo: "All states cover children to at least ~175% FPL; most go much higher. 'likely' and 'possible' bands are conservative placeholders until per-state limits are filled in."
    value: { likelyBelowPctFpl: 175, possibleBelowPctFpl: 300 }
  # Screening threshold for parents in non-expansion states without a statewide
  # adult program. Real parent limits are lower in most of those states.
  nonExpansionParentScreenPctFpl:
    <<: *medicaidExpansion
    todo: "Heuristic: parents at or below this % FPL are shown as 'possible – check your state'. Replace with per-state parent limits."
    value: 100

# ------------------------------------------------------------------------------
# Cost-model assumptions. These are estimates, not regulations.
# ------------------------------------------------------------------------------
assumptions:
  # Share of the total premium that employers typically pay. Used only to
  # estimate a COBRA premium from an old paycheck deduction.
  employerPremiumShare:
    <<: *kffEhbs
    value: { single: 0.84, family: 0.75 }
    todo: "Approximate KFF averages. Confirm against the latest Employer Health Benefits Survey."
  # Expected annual allowed medical spending per covered person, by usage level.
  annualAllowedSpendPerPerson:
    <<: *heuristic
    value: { LOW: 1000, MODERATE: 6000, HIGH: 25000 }
  # Coinsurance assumed after the deductible, by metal level.
  coinsuranceByMetal:
    <<: *heuristic
    value: { Catastrophic: 0.0, Bronze: 0.40, "Expanded Bronze": 0.40, Silver: 0.30, Gold: 0.20, Platinum: 0.10, EMPLOYER: 0.20 }
  # Used when the person doesn't know their old plan's deductible / out-of-pocket max.
  typicalEmployerPlan:
    <<: *kffEhbs
    value: { deductibleSingle: 1900, deductibleFamily: 3800, oopMaxSingle: 5000, oopMaxFamily: 10000 }
    todo: "Rough averages for employer plans. Verify against the latest KFF survey."

# ------------------------------------------------------------------------------
# States. exchange.type: HEALTHCARE_GOV or STATE (own enrollment platform).
# medicaidAdults.expanded: ACA expansion to 138% FPL.
# For non-expansion states adultLimitPctFpl is null unless a statewide adult
# program exists. Parent-only limits in those states are very low and vary.
# ------------------------------------------------------------------------------
_hcgov: &hcgov
  <<: *exchangeList
  value: { type: HEALTHCARE_GOV, name: HealthCare.gov, url: "https://www.healthcare.gov/" }
_expanded: &expanded
  <<: *medicaidExpansion
  value: { expanded: true, adultLimitPctFpl: 138 }
_notExpanded: &notExpanded
  <<: *medicaidExpansion
  todo: "Non-expansion state: adults without children generally ineligible; parent limits are very low and vary. Add parent limit if needed."
  value: { expanded: false, adultLimitPctFpl: null }
_chipUnknown: &chipUnknown
  <<: *chipLimits
  value: { limitPctFpl: null }
_medicaidUrl: &medicaidUrl
  <<: *medicaidHelp
  value: "https://www.healthcare.gov/medicaid-chip/getting-medicaid-chip/"

